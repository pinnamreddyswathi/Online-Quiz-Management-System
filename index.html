<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Score Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Online Quiz Score Calculator</h1>

    <label>Enter Correct Answers:</label>
    <input type="number" id="correct" placeholder="e.g. 8">

    <label>Enter Wrong Answers:</label>
    <input type="number" id="wrong" placeholder="e.g. 2">

    <button onclick="calculateScore()">Calculate Score</button>

    <h2 id="result"></h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
