<!DOCTYPE html>
<html>
<head>
    <title>Online Quiz Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Online Quiz Management System</h1>

<div class="container">
    <p id="question">Question will appear here</p>

    <button onclick="checkAnswer('A')" id="A"></button><br><br>
    <button onclick="checkAnswer('B')" id="B"></button><br><br>
    <button onclick="checkAnswer('C')" id="C"></button><br><br>
    <button onclick="checkAnswer('D')" id="D"></button><br><br>

    <button onclick="nextQuestion()">Next</button>

    <h2 id="score"></h2>
</div>

<script src="script.js"></script>

</body>
</html>
