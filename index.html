<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Score Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Online Quiz Score Calculator</h1>

    <input type="number" id="correct" placeholder="Enter Correct Answers">
    <input type="number" id="wrong" placeholder="Enter Wrong Answers">

    <button onclick="calculateScore()">Calculate Score</button>

    <h2 id="result">Result will appear here</h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
